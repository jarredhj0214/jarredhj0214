name: Refresh Commit Combat
on:
  schedule:
    - cron: '17 22 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/**', '.github/workflows/battle.yml']
permissions:
  contents: write
concurrency:
  group: profile-animation
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Render real contribution calendar
        env:
          GH_TOKEN: ${{ github.token }}
          PROFILE_LOGIN: ${{ github.repository_owner }}
        run: python scripts/render.py
      - name: Save updated artwork
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh contribution battlefield'
            git push
          fi
